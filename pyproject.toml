[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# #1765: a two-day pytest session filled node-27's 98 GB root volume with
# 27 GB of `/tmp/pytest-of-nwm`. pytest keeps the last 3 sessions' `tmp_path`
# roots by default; `failed` keeps only the directories of tests that failed,
# so a green session leaves nothing behind (local, CI and node-27 alike).
# NOT `--basetemp`: that wipes its target on every run and is shared config,
# so it would hit the Mac and CI too. The node-27 side of the bound is the
# host `TMPDIR=/home/nwm/tmp` discipline (docs/runbooks/
# tier-node27-timeseries-storage.md §8.6, node-27-bringup-checklist.md).
# Author contract: under this policy `tmp_path` is rmtree()d in its fixture
# finalizer, which calls os.scandir(fd). The rmtree runs with
# ignore_errors=True, so it absorbs OSError; what still errors at teardown is a
# global `os.scandir` / `os.lstat` patch that raises something else, or one
# that returns a malformed object (#1765 fixed two of those:
# tests/test_file_orchestration_journal.py and
# tests/test_qhh_production_bootstrap.py handed back fake entries rmtree could
# not walk). Scope such patches
# (`with monkeypatch.context() as patch:`) instead of leaving them global.
tmp_path_retention_policy = "failed"
# #1646: escalate only pytest's built-in thread-exception collector so an
# unhandled worker exception fails the owning test with its original cause,
# instead of passing as a warning-only false-green. Exact category only:
# unrelated warnings keep their default behavior.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "integration: requires explicitly configured external services such as PostgreSQL/PostGIS/TimescaleDB",
    "e2e: end-to-end pipeline tests (network/multi-step); run on node-27, excluded from pure CI",
    "real_disk: requires node-27 DATABASE_URL and OBJECT_STORE_ROOT, excluded from pure CI",
    "grib: decodes GRIB2 encoded at test time with the runtime's ecCodes, through cfgrib (no checked-in GRIB files); run on node-27, excluded from pure CI",
    "timescaledb_210: compression-semantics tests whose only valid oracle is a node-27 throwaway DB (TimescaleDB 2.10.2)",
    "node27_docker: explicitly opted-in disposable Docker oracle on node-27; requires NHMS_RUN_NODE27_DOCKER=1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "workers*", "packages*"]
