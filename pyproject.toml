[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhms"
version = "0.1.0"
description = "National Hydrological Modeling System"
requires-python = ">=3.11"
dependencies = [
    # Cap <0.137: 0.137.0 changed include_router to wrap children in a single
    # _IncludedRouter route instead of flattening copies into app.routes, which
    # breaks every app.routes-introspection site (slurm gateway _drop_route,
    # role-boundary route inventory). CI installs from uv.lock since #2573, but
    # any fresh resolve (`uv lock --upgrade`, a plain pip install) reads this
    # range, so an uncapped one silently drifts onto the breaking release.
    "fastapi>=0.110.0,<0.137",
    "uvicorn[standard]>=0.29.0",
    # No <2.1 cap (#2632): 2.1.0 made psycopg (v3) the default driver for
    # plain `postgresql://` URLs, and this project installs only psycopg2.
    # Every engine therefore names psycopg2 explicitly through
    # packages/common/sqlalchemy_url.py (guarded by
    # tests/test_sqlalchemy_driver_explicit.py), so 2.0 and 2.1 behave alike.
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "cdsapi>=0.7.0",
    "ecmwf-opendata>=0.3.19",
    "cfgrib>=0.9.10.4",
    "eccodes>=1.7.0",
    "xarray>=2024.3.0",
    "netCDF4>=1.6.5",
    "scipy>=1.12.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "gcsfs>=2024.2.0",
    "zarr>=2.17.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pyshp>=2.3.1",
    "pyproj>=3.7.2",
    "jsonschema>=4.23.0",
]

[project.scripts]
nhms-gfs = "workers.data_adapters.cli:main"
nhms-era5 = "workers.data_adapters.cli:era5_main"
nhms-ifs = "workers.data_adapters.cli:ifs_main"
nhms-canonical = "workers.canonical_converter.cli:main"
nhms-forcing = "workers.forcing_producer.cli:main"
nhms-model = "workers.model_registry.cli:main"
nhms-shud-runtime = "workers.shud_runtime.cli:main"
nhms-parse = "workers.output_parser.cli:main"
nhms-pipeline = "services.orchestrator.cli:main"
nhms-monitor = "services.orchestrator.monitoring:main"
nhms-production = "services.production_closure.slurm_validation:main"
nhms-state = "packages.common.state_cli:main"

[project.optional-dependencies]
dev = [
    "check-jsonschema>=0.29.0",
    "mapbox-vector-tile==2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

