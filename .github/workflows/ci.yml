name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR runs share one group per PR number and cancel superseded runs when you push
# repeatedly. Push-to-master and manual workflow_dispatch runs get a unique
# github.run_id group instead: they must never cancel each other or replace a
# same-group pending run, because the master full pytest is the only whole-repo
# regression after the PR targeted lane (#1650).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path scoping: each job below runs only when its area changed, so a frontend-only or docs-only PR
  # never pays the backend pytest or real-DB dry run, and a backend PR never pays the frontend build.
  # master is unprotected (no required status checks), so a skipped job does not deadlock merge.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      database: ${{ steps.filter.outputs.database }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      openapi: ${{ steps.filter.outputs.openapi }}
      schemas: ${{ steps.filter.outputs.schemas }}
      all_files: ${{ steps.filter.outputs.all_files }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The PR changed-file set IS the single authority for both paths-filter
          # and targeted selection: the selector must never recompute a
          # merge-base diff that can diverge after master changes while the PR
          # is open (#1650 D3). The JSON listing plus the catch-all filter
          # expose the complete set (not just backend_files — combination rules
          # read non-backend paths too).
          list-files: json
          filters: |
            all:
              - '**'
            backend:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/**'
              - 'packages/**'
              - 'apps/api/**'
              - 'services/**'
              - 'workers/**'
              - 'infra/**'
              - 'schemas/**'
              - 'db/**'
              - 'scripts/validate_*.py'
              - 'scripts/**/*.sh'
              - '.github/workflows/ci.yml'
              - 'openapi/**'
              # #1571: exact no-lane producers whose environment oracles must
              # start the targeted backend gate on producer-only PRs. The pin
              # is a bare version file, the instruction source and QHH sbatch
              # are markdown/shell, and the diagnostic README is docs-adjacent —
              # none matched any backend pattern, so producer-only diffs did not
              # start the targeted backend job. Exact literals only; `docs/**`
              # stays excluded.
              - '.python-version'
              - 'instructions/agents/shared.md'
              - 'scripts/run_qhh_cycle.sbatch'
              - 'scripts/diagnostic/qhh/README.md'
              - 'docs/runbooks/tier-node27-timeseries-storage.md'
              # #1860: the checked-in calibration declaration is a non-Python
              # producer whose package/publication consumers and selector
              # meta-guard must run on a declaration-only PR. Exact literal
              # only; other config files have different consumers.
              - 'config/calibration_overrides.yaml'
              # #2261: the committed review-gate round-ceiling memory. Its
              # realistic corruption path is the post-merge accounting commit
              # (docs/** + openspec/** + this JSON), which matched no backend
              # pattern — so the structural guard over it never started the
              # targeted gate. Exact literal only; no root `*.json` glob.
              - '.review-gate-issues.json'
              # #2477: the frozen review-loop ledger. `docs/**` is excluded, so
              # a ledger-only diff matched no backend pattern and the real-log
              # guard in the attribution suite never started the targeted
              # gate. Exact literal only; no `docs/**` or `*.jsonl` glob.
              - 'docs/review-loop-log.jsonl'
              # #2044 / #2602: the two other workflows' meta-tests (the
              # full-regression watcher wiring and the governance hard-gate job)
              # live in the backend lane, but a workflow-only diff matched no
              # backend pattern. Exact literals only; no `.github/**` glob.
              - '.github/workflows/full-regression-watch.yml'
              - '.github/workflows/governance.yml'
              # #2648: the frozen hard-line-reference baseline. A JSON data file
              # under scripts/ matched no backend pattern. Exact literal only.
              - 'scripts/governance/entropy_audit/line_reference_baseline.json'
              # #2709 / #2710: the floating-resolve report workflow's meta-test
              # and the full-regression shard duration table's partition tests
              # live in the backend lane; a workflow-only or JSON-only diff
              # matched no backend pattern. Exact literals only.
              - '.github/workflows/floating-resolve-report.yml'
              - 'scripts/ci/full_test_durations.json'
            database:
              - 'db/**'
              - 'packages/common/migrate.py'
              - 'packages/common/forecast_store.py'
              - 'packages/common/display_coverage.py'
              - 'packages/common/timescale_write_guard.py'
              - 'packages/common/object_store.py'
              - 'packages/common/model_registry.py'
              - 'packages/common/model_registry_*.py'
              - 'packages/common/grid_registry_store.py'
              # #2300: the handoff apply's station upsert is proven only on a real
              # heap (ctid / xmin); its suite is matched by `tests/*integration*.py`.
              - 'packages/common/forcing_domain_handoff_apply.py'
              - 'services/tiles/mvt.py'
              - 'services/tile_publisher/publisher.py'
              - 'services/tile_publisher/forcing_copyback_backfill.py'
              - 'apps/api/main.py'
              - 'apps/api/routes/hydro_display.py'
              - 'apps/api/routes/hydro_display_*.py'
              - 'scripts/node27_autopipeline.py'
              - 'scripts/node27_timeseries_decompression_replay.py'
              - 'workers/output_parser/parser.py'
              - 'workers/grid_registry/**'
              - 'workers/model_registry/**'
              - 'workers/forcing_producer/**'
              - 'services/orchestrator/scheduler.py'
              - 'services/orchestrator/pipeline_job_provenance.py'
              - 'scripts/backfill_pipeline_job_provenance.py'
              # #1729 / #1480: the one-shot node-27 data scripts and their runner are
              # proven only by the disposable-DB suites, so a script-only diff must open
              # this lane. Exact literals, no `scripts/ops/**` glob.
              - 'scripts/ops/node27_oneshot_sql.py'
              - 'scripts/ops/node27_1729_delete_evidence_basin.sql'
              - 'scripts/ops/node27_1729_delete_evidence_basin_backup.sql'
              - 'scripts/ops/node27_1729_delete_evidence_basin_rollback.sql'
              - 'scripts/ops/node27_1480_backfill_seed_station_provenance.sql'
              - 'scripts/ops/node27_1480_backfill_seed_station_provenance_rollback.sql'
              # #2621: the rename-leftover delete / rollback pair and the catalog /
              # manifest audit (production `list_basins` over a real catalog).
              - 'scripts/ops/node27_2621_delete_rename_leftovers.sql'
              - 'scripts/ops/node27_2621_delete_rename_leftovers_rollback.sql'
              - 'scripts/basin_catalog_manifest_audit.py'
              # #2699: the weight purge tool's rule and its COPY (DELETE ... RETURNING)
              # run only in the real-PG suite. Exact literal.
              - 'scripts/node27_purge_superseded_weights.py'

              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - 'tests/integration_helpers.py'
              # #2208's three frozen pre-store snapshots went with #1342's contract
              # (task 6.3) — they existed to prove legacy/narrow equivalence, and
              # after the contract there is no legacy side. The registry loader stays:
              # it still feeds the national integration consumer.
              - 'tests/river_ts_template_registry.py'
              - 'tests/*integration*.py'
              - 'tests/**/*integration*.py'
              # #1913: the registry-import monolith is seven partitioned suites plus one
              # shared helper. Only the three integration-owning partitions (auth 5, DB 5,
              # QHH 7 nodes), the retained core (owns the CLI/database gate contracts whose
              # refusal proofs must rerun on database-lane changes) and the helper open this
              # lane; parser, CLI and security own no integration node and deliberately do
              # NOT. Exact literals, never a `test_basins_registry_import*` glob: the glob
              # would rescue deletion of any one edge and sweep the three non-integration
              # owners into the lane.
              - 'tests/basins_registry_import_helpers.py'
              - 'tests/test_basins_registry_import.py'
              - 'tests/test_basins_registry_import_auth.py'
              - 'tests/test_basins_registry_import_db.py'
              - 'tests/test_basins_registry_import_qhh.py'
              - 'tests/test_basins_reingest.py'
              - 'tests/test_migrations.py'
              - 'tests/test_node27_timeseries_decompression_replay.py'
              # #1948: the QHH bootstrap corpus is three partitions + one helper, and only
              # the scheduler partition carries `@pytest.mark.integration` (11 nodes) while
              # the helper owns the imported readiness fixture and its DB seeding/cleanup.
              # Both are exact triggers; the retained/state partitions own no integration
              # node and therefore deliberately do NOT open this lane. The scheduler name
              # deliberately omits `integration`: `tests/*integration*.py` below would
              # otherwise rescue deletion of its exact edge.
              - 'tests/qhh_production_bootstrap_helpers.py'
              - 'tests/test_qhh_production_bootstrap_scheduler.py'
              - 'tests/test_real_*.py'
            frontend:
              - 'apps/frontend/**'
              - 'openapi/**'
              # C4's AJV negative suite is frontend-only. Schema metavalidation
              # and positive examples cannot prove its branch rejections.
              - 'schemas/frontend_c4_live_evidence.schema.json'
              - 'schemas/examples/frontend_c4_live_evidence*.json'
            docs:
              - 'docs/**'
            openapi:
              - 'openapi/**'
            schemas:
              - 'schemas/**'

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "docs/**/*.md"

  openapi-validate:
    name: OpenAPI Validate
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @redocly/cli@1.25.13 lint openapi/nhms.v1.yaml --skip-rule no-unused-components
        if: hashFiles('openapi/nhms.v1.yaml') != ''
      - run: echo "openapi/nhms.v1.yaml not found — skipping validation"
        if: hashFiles('openapi/nhms.v1.yaml') == ''

  json-schema-validate:
    name: JSON Schema Validate
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check-jsonschema
        run: pip install check-jsonschema>=0.29.0
      - name: Meta-validate schemas
        run: |
          SCHEMAS=$(find schemas/ -name '*.schema.json' 2>/dev/null)
          if [ -z "$SCHEMAS" ]; then
            echo "No schema files found — skipping"
            exit 0
          fi
          for schema in $SCHEMAS; do
            echo "Validating $schema ..."
            check-jsonschema --check-metaschema "$schema"
          done
      - name: Validate examples against schemas
        run: |
          for example in schemas/examples/*.json; do
            [ -f "$example" ] || { echo "No example files — skipping"; exit 0; }
            base=$(basename "$example" .example.json)
            schema="schemas/${base}.schema.json"
            if [ -f "$schema" ]; then
              echo "Validating $example against $schema ..."
              check-jsonschema --schemafile "$schema" "$example"
            else
              family=$(echo "$base" | sed -E 's/\.(noop|intent|partial|error)$//')
              family_schema="schemas/${family}.schema.json"
              if [ "$family" != "$base" ] && [ -f "$family_schema" ]; then
                echo "Validating $example against $family_schema ..."
                check-jsonschema --schemafile "$family_schema" "$example"
              else
                echo "WARNING: No schema found for $example (expected $schema)"
              fi
            fi
          done

  # Merge-gate database suite. PR and push runs are limited to migration, database,
  # integration-test, or dependency surfaces; workflow_dispatch remains an explicit
  # real-DB dry-run escape hatch. Full unit pytest is reserved for push-to-master or
  # manual workflow_dispatch; PRs run the focused unit-test job below.
  real-db-integration:
    name: SQL Migration Dry Run
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        needs.changes.outputs.database == 'true' &&
        (github.event_name == 'push' || github.event.pull_request.draft == false)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb-ha:pg15-latest
        env:
          POSTGRES_DB: nhms
          POSTGRES_USER: nhms
          POSTGRES_PASSWORD: nhms_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nhms -d nhms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    env:
      DATABASE_URL: postgresql://nhms:nhms_dev@localhost:5432/nhms
      NHMS_RUN_INTEGRATION: "1"
      NHMS_INTEGRATION_DATABASE_URL: postgresql://nhms:nhms_dev@localhost:5432/nhms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      # #2573: install the locked set, never a floating resolve. A floating
      # `pip install -e ".[dev]"` pulled eccodes 2.49 + eckitlib, whose bundled
      # PROJ (loaded RTLD_GLOBAL) collided with pyproj's and crashed pytest at
      # interpreter exit. `--locked` also fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      # The bare `pytest`/`python` below must resolve to the locked venv.
      # $GITHUB_PATH is the only PATH change: job/workflow `env` is pinned.
      - name: Put the locked venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run real database integration tests
        # #1688: `-vv -rs` only — node-level pass/skip reasons in the run log
        # so the seven residual-debt tests appear as PASSED rather than skips.
        # The generic pg15-latest service is not the node-27 2.10.2 oracle:
        # retain ordinary integration coverage but exclude only that explicit lane.
        run: pytest -vv -rs -m "integration and not timescaledb_210"

  unit-test:
    name: Unit Tests (full)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.backend == 'true' && github.event_name == 'push')
    runs-on: ubuntu-latest
    # #2710: the single job ran 39-59 min against a 60-min wall and was killed
    # at it twice (2026-09-22, 2026-10-01). It is now a matrix: every shard runs
    # the test files scripts/ci/shard_tests.py assigns to it, balanced by the
    # per-file seconds in scripts/ci/full_test_durations.json. The shards are
    # disjoint and together cover every test file pytest collects, so the test
    # set is the one the single job ran. The shard list below is the only place
    # the shard count is written: the step passes `strategy.job-total`, and the
    # watcher (scripts/ci/full_regression_watch.py) derives the job names
    # `Unit Tests (full) (<shard>)` from this matrix. Keep `name` static and the
    # matrix one-dimensional, or those names change.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 30 per shard; the old 60 was NOT raised. Measured 2026-10-04 on one full
    # local run (41.7 min as a single process, the same scale as the 39-59 min
    # hosted runs): 2484 s of test time, 621 s (10.4 min) per shard. Projected
    # 10-15 min per shard on a hosted runner, i.e. about half of this and far
    # from the watcher's 80% line (24 min), which now applies to each shard.
    # --durations=25 still names the slowest tests of every shard.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      # #2573: install the locked set, never a floating resolve. A floating
      # `pip install -e ".[dev]"` pulled eccodes 2.49 + eckitlib, whose bundled
      # PROJ (loaded RTLD_GLOBAL) collided with pyproj's and crashed pytest at
      # interpreter exit. `--locked` also fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      # The bare `pytest`/`python` below must resolve to the locked venv.
      # $GITHUB_PATH is the only PATH change: job/workflow `env` is pinned.
      - name: Put the locked venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare scratch evidence root
        run: |
          sudo mkdir -p /scratch/frd_muziyao
          sudo chown "$USER:$(id -gn)" /scratch/frd_muziyao
          chmod u+rwx /scratch/frd_muziyao
      - name: List this shard's test files
        # Its own command writing a file, never a command substitution in
        # pytest's arguments: a failing lister must fail this step. pytest
        # given no path would run all of `testpaths` in every shard.
        run: |
          python scripts/ci/shard_tests.py --shard ${{ matrix.shard }} --total ${{ strategy.job-total }} > shard-files.txt
          test -s shard-files.txt
          echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }}: $(wc -l < shard-files.txt) test files"
      - name: Run full unit test suite
        # -q, not -v: nothing downstream parses this log, unit-test-targeted
        # already uses -q, and -v prints a line per test across ~22k tests.
        # --durations=25 is the instrument: it names the slowest tests in every
        # run, so a future slowdown is attributable instead of guessed at.
        run: |
          mapfile -t shard_files < shard-files.txt
          pytest "${shard_files[@]}" -q --tb=short --durations=25 -m "not e2e and not grib and not integration"

  # PR merge gate: run a focused suite derived from changed files. The selector maps runtime
  # modules/config surfaces to their owning tests and falls back to core smoke tests for unknown
  # backend Python paths. Full unit tests still run on master and on manual workflow_dispatch.
  unit-test-targeted:
    name: Unit Tests
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 35: scheduler/orchestration PRs select the heaviest test files; the
    # selected suite alone runs ~20 min on hosted runners (observed twice
    # cancelled at the old 20-min cap with 0 failures at 83% progress).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      # #2573: install the locked set, never a floating resolve. A floating
      # `pip install -e ".[dev]"` pulled eccodes 2.49 + eckitlib, whose bundled
      # PROJ (loaded RTLD_GLOBAL) collided with pyproj's and crashed pytest at
      # interpreter exit. `--locked` also fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      # The bare `pytest`/`python` below must resolve to the locked venv.
      # $GITHUB_PATH is the only PATH change: job/workflow `env` is pinned.
      - name: Put the locked venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare scratch evidence root
        run: |
          sudo mkdir -p /scratch/frd_muziyao
          sudo chown "$USER:$(id -gn)" /scratch/frd_muziyao
          chmod u+rwx /scratch/frd_muziyao
      - name: Select targeted tests
        id: targeted
        env:
          CHANGED_FILES_JSON: ${{ needs.changes.outputs.all_files }}
        run: |
          # Consume the paths-filter PR changed-file set (single authority, #1650
          # D3). JSON is passed via env, never shell-interpolated/split, and
          # converted with the runner-provided jq, never through uv: the locked
          # venv is already on PATH, and a uv invocation would re-sync it.
          # Empty JSON writes an empty changed-file list, which makes the
          # selector select nothing and the count==0 branch below report
          # collect-only smoke. GitHub path values never
          # contain newlines, so the newline-separated selector seam is exact.
          jq -r '.[]' <<< "$CHANGED_FILES_JSON" > .ci-changed-files.txt
          python scripts/select_ci_tests.py --changed-file .ci-changed-files.txt --github-output "$GITHUB_OUTPUT"
      - name: Run targeted tests
        env:
          TARGETED_TESTS_JSON: ${{ steps.targeted.outputs.tests_json }}
        run: |
          if [ "${{ steps.targeted.outputs.count }}" != "0" ]; then
            python -c 'import json, os, subprocess; tests = json.loads(os.environ["TARGETED_TESTS_JSON"]); print("Targeted test files:"); [print(f"  {test}") for test in tests]; subprocess.run(["pytest", "-q", *tests], check=True)'
            if [ "${{ steps.targeted.outputs.collection_smoke_required }}" = "true" ]; then
              if [ "${{ steps.targeted.outputs.meta_guard_only }}" = "true" ]; then
                echo "Selection collapsed to the selector meta-guard — also running collect-only smoke (import/syntax across suite)"
                echo "::warning title=Unit Tests selection collapsed to the selector meta-guard::select_ci_tests.py mapped this diff to tests/test_select_ci_tests.py alone (deleted test file, tests/ support module, or a selector-development diff); that suite ran its assertions and the full-tree collect-only smoke ran in addition (issue #1454)"
                {
                  echo "## Unit Tests: selection collapsed to the selector meta-guard"
                  echo ""
                  echo "select_ci_tests.py mapped this PR diff to tests/test_select_ci_tests.py alone."
                  echo "That suite ran its assertions; the full-tree collect-only smoke (import/syntax"
                  echo "check across the whole suite) ran in addition, because a diff of this shape can"
                  echo "break cross-test imports that the targeted run never touches."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Selector-development diff — also running collect-only smoke (import/syntax across suite)"
                echo "::warning title=Unit Tests selector-development diff::select_ci_tests.py or its suite changed; the targeted selection ran its assertions and the full-tree collect-only smoke ran in addition (issue #1454)"
                {
                  echo "## Unit Tests: selector-development diff"
                  echo ""
                  echo "select_ci_tests.py or tests/test_select_ci_tests.py changed; the targeted selection"
                  echo "ran its assertions and the full-tree collect-only smoke (import/syntax check across"
                  echo "the whole suite) ran in addition, because a diff of this shape can break cross-test"
                  echo "imports that the targeted run never touches."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              # Redirect, never pipe: see the count == 0 branch below.
              if pytest tests/ -q --collect-only > collect-only.log 2>&1; then
                tail -n 5 collect-only.log
              else
                cat collect-only.log
                exit 1
              fi
            fi
          else
            echo "No backend test files selected — running collect-only smoke (import/syntax across suite)"
            echo "::warning title=Unit Tests executed 0 assertions::select_ci_tests.py mapped no test files for this diff; collect-only smoke verifies imports/syntax only (issue #1182)"
            {
              echo "## Unit Tests: collect-only smoke (0 assertions executed)"
              echo ""
              echo "select_ci_tests.py selected no backend test files for this PR diff."
              echo "The suite was only collected (import/syntax check); no test assertions ran."
            } >> "$GITHUB_STEP_SUMMARY"
            # Redirect, never pipe: `bash -e` runs without pipefail, so piping
            # pytest into tail would report the tail's exit code and turn a
            # collection failure green. Collection output is ~12k lines.
            if pytest tests/ -q --collect-only > collect-only.log 2>&1; then
              tail -n 5 collect-only.log
            else
              cat collect-only.log
              exit 1
            fi
          fi

  frontend-build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # 30: the mocked-regression Playwright lane runs serially (one worker) and
    # has grown with the mobile projects (openspec change
    # mobile-responsive-display): it measured 16m41s / 14m10s before the
    # three-project sheet-yields-chrome spec was added, so 20 left no headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Install frontend dependencies
        run: cd apps/frontend && pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: cd apps/frontend && pnpm typecheck
      - name: Typecheck frontend tooling
        run: cd apps/frontend && pnpm run check:types
      - name: Build and test frontend
        run: cd apps/frontend && pnpm build && pnpm test
      - name: Check frontend bundle size
        run: cd apps/frontend && pnpm check:bundle
      # playwright.config.ts's webServer.command hardcodes `corepack pnpm dev`,
      # and this job gets pnpm from pnpm/action-setup (no corepack shim), so the
      # mocked-regression dev server cannot start without activating corepack.
      - name: Enable corepack pnpm for the Playwright dev server
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/pnpm-lock.yaml') }}
      - name: Install Playwright chromium
        run: cd apps/frontend && pnpm exec playwright install --with-deps chromium
      # Mocked-regression lane only (playwright.config.ts testIgnore excludes the
      # preview-deeplink, live-display, live-c4-display and m15-visual specs).
      # No retries: a failure here must stay a failure.
      - name: Run frontend mocked-regression Playwright lane
        run: cd apps/frontend && pnpm run test:e2e:mocked-regression
