resource_profiles:
  default:
    partition: compute
    nodes: 1
    ntasks: 1
    cpus_per_task: 4
    memory_gb: 8
    # A cohort submits as ONE array whose resources are resolved from task 0's model
    # only (real_backend._normalize_array_request -> resolve_resource_profile). Since
    # #2543 the scheduler splits each cohort by this file's override keys, so every
    # model listed under `overrides` is task 0 of its own array and its override
    # applies; every other model shares this default. To give a large basin more
    # cores, add an override for EACH of its direct-grid model_ids (cpus_per_task,
    # memory_gb, shud_threads) and set the registry rows' resource_profile.shud_threads
    # to the same value -- the solver's own thread count comes from the registry; the
    # exported SHUD_THREADS / OMP_NUM_THREADS and the core request come from this file.
    # A job type listed under `job_type_overrides` is then applied on top of the
    # model's profile for that stage only, and does not change the cohort split.
    # See docs/runbooks/production-ops/service-bringup.md.
    # This walltime stays the ceiling for every default-group member: HHe's SHUD
    # wall-clock swings with forcing intensity (7 min .. >5h50m observed) and
    # 06:00:00 killed IFS 2026071012
    # (job 24081_1, FAILED at 05:50:38). Registry already declares walltime_minutes=720
    # for these basins; 14h keeps margin above that.
    walltime: "14:00:00"
    max_concurrent: 32
    shud_threads: 4
  overrides:
    # basins_hlj (27650 river segments): SHUD forecast ~30 min on 4 cores vs <=6 min
    # for every other basin (2026-09-22, jobs 53388_2 / 53374_6, MaxRSS ~1.3 GB,
    # CPU-bound). GFS and IFS direct-grid variants; registry rows carry shud_threads=12.
    dg_3b091cccc163690de93cddd9c4c32472:
      cpus_per_task: 12
      memory_gb: 8
      shud_threads: 12
    dg_8a34ed2ba8f8dd22f2716405569628a9:
      cpus_per_task: 12
      memory_gb: 8
      shud_threads: 12
    yangtze_shud_v12:
      cpus_per_task: 64
      memory_gb: 256
      walltime: "12:00:00"
      shud_threads: 64
  # Per-job-type overrides, keyed by the gateway job type (the key of the
  # job-type -> template mapping). Resolution order: default, then
  # overrides[model_id], then job_type_overrides[job_type], then the deployment
  # overlay (partition override / excluded nodes); the job type wins over the
  # model. An entry may set only cpus_per_task, memory_gb and shud_threads, and
  # must set cpus_per_task and shud_threads together; anything else is refused
  # when the file is loaded.
  job_type_overrides:
    # The forcing producer is single-threaded and CPU-bound: sacct on 2026-11-25
    # showed (user+sys)/elapsed = 1.00 on 4-core tasks (0.99 on 12-core HLJ tasks),
    # peak RSS 0.46 GB, so 3 of every 4 (11 of 12) requested cores sat idle (#3344).
    # Memory is left at the model's value (not a consumable resource on this
    # cluster). Rollback: delete this entry; the file is read on every submission.
    produce_forcing_array:
      cpus_per_task: 1
      shud_threads: 1
