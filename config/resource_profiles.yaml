resource_profiles:
  default:
    partition: compute
    nodes: 1
    ntasks: 1
    cpus_per_task: 4
    memory_gb: 8
    # A cohort submits as ONE array whose resources are resolved from task 0's model
    # only (real_backend._normalize_array_request -> resolve_resource_profile). Since
    # #2543 the scheduler splits each cohort by this file's override keys, so every
    # model listed under `overrides` is task 0 of its own array and its override
    # applies; every other model shares this default. To give a large basin more
    # cores, add an override for EACH of its direct-grid model_ids (cpus_per_task,
    # memory_gb, shud_threads) and set the registry rows' resource_profile.shud_threads
    # to the same value -- SHUD threads come from the registry, not from this file.
    # See docs/runbooks/production-ops/service-bringup.md.
    # This walltime stays the ceiling for every default-group member: HHe's SHUD
    # wall-clock swings with forcing intensity (7 min .. >5h50m observed) and
    # 06:00:00 killed IFS 2026071012
    # (job 24081_1, FAILED at 05:50:38). Registry already declares walltime_minutes=720
    # for these basins; 14h keeps margin above that.
    walltime: "14:00:00"
    max_concurrent: 32
    shud_threads: 4
  overrides:
    yangtze_shud_v12:
      cpus_per_task: 64
      memory_gb: 256
      walltime: "12:00:00"
      shud_threads: 64
    m24_smoke:
      nodes: 1
      ntasks: 1
      cpus_per_task: 1
      memory_gb: 1
      walltime: "00:02:00"
      max_concurrent: 1
      shud_threads: 1
