resource_profiles:
  default:
    partition: compute
    nodes: 1
    ntasks: 1
    cpus_per_task: 4
    memory_gb: 8
    # Forecast cohorts submit as ONE array whose walltime is resolved from task 0's
    # model only (real_backend._normalize_array_request -> resolve_resource_profile),
    # so a per-basin override cannot protect a slow member: this default is the
    # effective ceiling for every member. HHe's SHUD wall-clock swings with forcing
    # intensity (7 min .. >5h50m observed) and 06:00:00 killed IFS 2026071012
    # (job 24081_1, FAILED at 05:50:38). Registry already declares walltime_minutes=720
    # for these basins; 14h keeps margin above that.
    walltime: "14:00:00"
    max_concurrent: 32
    shud_threads: 4
  overrides:
    yangtze_shud_v12:
      cpus_per_task: 64
      memory_gb: 256
      walltime: "12:00:00"
      shud_threads: 64
    m24_smoke:
      nodes: 1
      ntasks: 1
      cpus_per_task: 1
      memory_gb: 1
      walltime: "00:02:00"
      max_concurrent: 1
      shud_threads: 1
